name: PR Review Router

on:
  workflow_run:
    workflows: [PR Review Intake]
    types: [completed]

permissions: {}

concurrency:
  group: pr-review-router-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.repository.id == github.repository_id
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted routing code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run's SHA is on the default branch, not the PR head.
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: eng/tools/pr-review

      - name: Validate and dispatch the requested review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { routeReviewRequest } = require('./eng/tools/pr-review/review-request.cjs');
            await routeReviewRequest({ github, context, core });
