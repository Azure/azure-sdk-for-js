name: GitHubActionsCredential E2E

on:
  push:
    branches:
      - kaghiya/github-actions-credential
  workflow_dispatch:
    inputs:
      scope:
        description: Token scope to request
        required: true
        default: https://management.azure.com/.default

permissions:
  contents: read
  id-token: write

jobs:
  authenticate:
    runs-on: ubuntu-latest
    env:
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      TEST_SCOPE: ${{ inputs.scope || 'https://management.azure.com/.default' }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate configuration
        run: |
          if [[ -z "$AZURE_TENANT_ID" || -z "$AZURE_CLIENT_ID" ]]; then
            echo "::error::Configure AZURE_TENANT_ID and AZURE_CLIENT_ID as repository variables."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install --global pnpm@10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Azure Identity
        run: pnpm turbo build --filter=@azure/identity... --token 1

      - name: Acquire an access token
        working-directory: sdk/identity/identity
        run: |
          node --input-type=module -e '
            import { GitHubActionsCredential } from "./dist/esm/index.js";

            const credential = new GitHubActionsCredential();
            const token = await credential.getToken(process.env.TEST_SCOPE);

            if (!token?.token) {
              throw new Error("GitHubActionsCredential did not return an access token.");
            }

            console.log(`Successfully acquired an access token expiring at ${new Date(token.expiresOnTimestamp).toISOString()}.`);
          '
