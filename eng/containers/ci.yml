pr: none

trigger:
  branches:
    include:
    - main
  paths:
    include:
    - eng/containers/

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    stages:
    - stage:
      displayName: Docker Build and Publish
      variables:
      - template: /eng/pipelines/templates/variables/globals.yml
      - template: /eng/pipelines/templates/variables/image.yml
      - name: configPath
        value: ./eng/containers/turborepo-remote-cache
      - name: containerRegistry
        value: 'azsdkengsys'
      - name: imageRepository
        value: 'js/turborepo-remote-cache'
      - name: imageTag
        value: $(build.buildid)

      jobs:
      - job:
        displayName: Docker Build and Publish
        pool:
          name: $(LINUXPOOL)
          image: $(LINUXVMIMAGE)
          os: linux

        templateContext:
          outputs:
          - output: containerImage
            image: image:tag
            remoteImage:
            - $(containerRegistry).azurecr.io/$(imageRepository):$(imageTag)

        steps:
        - template: /eng/common/pipelines/templates/steps/sparse-checkout.yml

        - pwsh: |
            $packageManager = (Get-Content -Raw package.json | ConvertFrom-Json).packageManager
            if ($packageManager -notmatch '^pnpm@([^+]+)(?:\+.+)?$') {
              throw "Root package.json must declare a valid pnpm packageManager; found '$packageManager'."
            }
            Set-Content -Path (Join-Path '$(configPath)' 'pnpm-version.txt') -Value $Matches[1] -NoNewline -Encoding utf8
          displayName: Prepare pnpm version for Docker build
          workingDirectory: $(Build.SourcesDirectory)

        - task: AzureCLI@2
          displayName: Login to $(containerRegistry)
          inputs:
            azureSubscription: "Azure SDK Engineering System"
            scriptType: pscore
            scriptLocation: inlineScript
            inlineScript: |
              az acr login --name $(containerRegistry)

        - task: 1ES.BuildContainerImage@1
          displayName: Build Docker Image
          inputs:
            path: $(configPath)
            image: image:tag
            enableNetwork: true
            useBuildKit: true
