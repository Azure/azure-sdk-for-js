# Switches the agent to the Node version under test ($(NodeTestVersion)) after
# packages have already been built with the "ship" version
# ($(NODE_VERSION_LTS_MAINTENANCE)).
#
# NOTE: common.yml is job-scoped and is included by the job template that
# consumes this file. Do not include it here.
#
# There is deliberately no "reinstall native dependencies" step. Native
# dependencies do not need rebuilding when the Node major version changes:
#
#   * pnpm never builds them. pnpm-workspace.yaml sets `allowBuilds: false` for
#     keytar, @azure/msal-node-extensions and @azure/msal-node-runtime, so their
#     install scripts do not run and nothing is compiled locally.
#   * All of them ship Node-API / prebuilt binaries, which are ABI-stable across
#     Node major versions. keytar declares `binary.napi_versions: [3]`,
#     @azure/msal-node-extensions' install script is `exit 0`, and
#     @azure/msal-node-runtime's install script only copies prebuilt binaries.
#
# If a genuinely ABI-sensitive dependency is ever added, prefer `pnpm rebuild`
# over hand-rolled path walking.

steps:
  - template: use-node-version.yml
    parameters:
      NodeVersion: $(NodeTestVersion)
      # Packages are built with NODE_VERSION_LTS_MAINTENANCE, so legs testing that
      # same version are already on it and do not need the tool installed again.
      # The verification step inside use-node-version.yml still runs and asserts it.
      InstallCondition: and(succeeded(), ne(variables['NodeTestVersion'], variables['NODE_VERSION_LTS_MAINTENANCE']))
