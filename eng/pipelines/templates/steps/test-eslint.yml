parameters:
  ServiceDirectory: ''

steps:
  - template: /eng/pipelines/templates/steps/install-pnpm.yml

  - script: |
      pnpm install
    displayName: "Install library dependencies"

  - pwsh: |
      pnpm build --filter @azure/monitor-opentelemetry...
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      $env:FORCE_COLOR = "1"
      node eng/tools/ci-runner/index.js lint "${{parameters.ServiceDirectory}}"
    env:
      TURBO_TEAM: azsdkjs
      TURBO_TEAMID: azsdkjs
      TURBO_CACHE: local:rw,remote:r
      TURBO_TOKEN: faketoken
    displayName: "Build Lint Prerequisites and Lint Libraries"

  - pwsh: |
      pnpm test --filter @azure/eslint-plugin-azure-sdk...
    displayName: "Run ESLint Plugin Unit Tests"
