parameters:
  NodeVersion: $(NODE_VERSION_LTS_MAINTENANCE)
  # Applied to the UseNode task only, so callers can skip the (relatively slow)
  # tool install when the requested version is already active. The verification
  # step below always runs, so the version is asserted either way.
  InstallCondition: succeeded()

steps:
  - task: UseNode@1
    inputs:
      version: ${{ parameters.NodeVersion }}
    displayName: "Use Node ${{ parameters.NodeVersion }}"
    condition: ${{ parameters.InstallCondition }}

  - pwsh: |
      $expectedVersion = "${{ parameters.NodeVersion }}"
      Write-Host "Expected Node Version: $expectedVersion"

      $versionOutput = node --version
      if ($LASTEXITCODE -ne 0 -or $versionOutput -notmatch '^v\d+\.\d+\.\d+$') {
        throw "Unable to determine a stable Node.js version: $versionOutput"
      }
      $actualVersion = [version]$versionOutput.Substring(1)
      Write-Host "Actual Node Version: $actualVersion"
      Write-Host "Actual NPM Version: $(npm --version)"

      $expectedMajorVersion = $expectedVersion.Split(".")[0]
      if ($expectedMajorVersion -ne $actualVersion.Major.ToString()) {
        throw "Expected Node.js $expectedVersion, but found $actualVersion"
      }
      if ($expectedVersion -match '^\d+\.\d+\.\d+$' -and $actualVersion -ne [version]$expectedVersion) {
        throw "Expected exact Node.js $expectedVersion, but found $actualVersion"
      }

      # A cached runtime can satisfy a major selector without containing the security fixes.
      $securityFloors = @{
        22 = [version]"22.23.4"
        24 = [version]"24.22.1"
        26 = [version]"26.12.1"
      }
      $minimumVersion = $securityFloors[$actualVersion.Major]
      if (-not $minimumVersion -or $actualVersion -lt $minimumVersion) {
        throw "Node.js $actualVersion does not meet the October 21, 2026 security baseline. Use 22.23.4, 24.22.1, or 26.12.1 or a later patch on the same supported release line."
      }
    displayName: "Verify Node Version"
