parameters:
- name: jobToRun
  displayName: Job to run
  type: string
  default: All
  values:
  - All
  - CheckAgenticWorkflows
  - PnpmUpdate
  - CheckDependency

trigger: none
pr: none

jobs:
- job: 'CheckAgenticWorkflows'
  displayName: 'Check Agentic Workflows Upgrade'
  condition: and(succeeded(), or(eq('${{ parameters.jobToRun }}', 'All'), eq('${{ parameters.jobToRun }}', 'CheckAgenticWorkflows')))
  variables:
  - template: /eng/pipelines/templates/variables/globals.yml

  pool:
    name: azsdk-pool
    demands: ImageOverride -equals ubuntu-24.04

  steps:
  - template: /eng/pipelines/templates/steps/common.yml
  - template: /eng/common/pipelines/templates/steps/set-default-branch.yml
  - template: /eng/pipelines/templates/steps/install-pnpm.yml
  - template: /eng/common/pipelines/templates/steps/login-to-github.yml

  - script: pnpm install --filter @azure-tools/agentic-workflows-upgrade-check --frozen-lockfile
    displayName: 'Install Upgrade Checker Dependencies'

  - script: pnpm --filter @azure-tools/agentic-workflows-upgrade-check test
    displayName: 'Test Upgrade Checker'

  - script: node eng/tools/agentic-workflows/check-upgrade.mjs
    displayName: 'Check gh-aw Release and File Upgrade Issue'
    env:
      GH_TOKEN: $(GH_TOKEN)

- job: 'PnpmUpdate'
  displayName: 'Pnpm Update'
  condition: and(succeeded(), or(eq('${{ parameters.jobToRun }}', 'All'), eq('${{ parameters.jobToRun }}', 'PnpmUpdate')))
  timeoutInMinutes: 180
  variables:
  - template: /eng/pipelines/templates/variables/globals.yml

  pool:
    name: azsdk-pool
    demands: ImageOverride -equals ubuntu-24.04

  steps:
  - template: /eng/pipelines/templates/steps/common.yml
  - template: /eng/common/pipelines/templates/steps/set-default-branch.yml

  - template: /eng/pipelines/templates/steps/install-pnpm.yml

  - script: |
      pnpm update --recursive --no-save
    displayName: "Run Pnpm Update"

  - script: |
      pnpm install --force
    displayName: "Run Pnpm install --force to install all optional dependencies"

  - script: |
      pnpm turbo build
    env:
      TURBO_TEAM: azsdkjs
      TURBO_TEAMID: azsdkjs
      TURBO_TOKEN: $(js-turborepo-cache-token)
      TURBO_CACHE: local:rw,remote:rw
    displayName: "Build All packages"

  - template: /eng/common/pipelines/templates/steps/create-pull-request.yml
    parameters:
      RepoName: azure-sdk-for-js
      BaseBranchName: main
      PRBranchName: automated-deps-update
      CommitMsg: "Automatic pnpm update"
      PRTitle: "[EngSys] automatic pnpm update"
      PRBody: "This is an automatic PR generated weekly with changes from running the command pnpm update"
      PushArgs: "-f"
      AuthToken: ''


- job: 'CheckDependency'
  displayName: 'Check Package Dependency'
  condition: and(succeeded(), or(eq('${{ parameters.jobToRun }}', 'All'), eq('${{ parameters.jobToRun }}', 'CheckDependency')))
  variables:
  - template: /eng/pipelines/templates/variables/globals.yml

  pool:
    name: azsdk-pool
    demands: ImageOverride -equals ubuntu-24.04

  steps:
  - template: /eng/pipelines/templates/steps/common.yml
  - template: /eng/common/pipelines/templates/steps/set-default-branch.yml

  - template: /eng/pipelines/templates/steps/install-pnpm.yml

  - script: |
      node eng/tools/purge-node-modules.mjs sdk common
      git clean -xdf
    displayName: "Reset workspace"

  - template: /eng/common/pipelines/templates/steps/login-to-github.yml

  - task: PowerShell@2
    displayName: 'Check Dependency Warnings and File GitHub Issues'
    inputs:
      targetType: filePath
      filePath: $(Build.SourcesDirectory)/eng/scripts/check-external-dependency.ps1
      arguments: >
        -RepoName azure-sdk-for-js
        -RepoOwner azure
        -AuthToken "$(GH_TOKEN)"
      pwsh: true

  - script: |
      git reset --hard
    displayName: "Reset Changes"
