# warp.config.yml — build configuration

exports:
  "./package.json": "./package.json"
  ".": "./src/index.ts"
  "./api": "./src/api/index.ts"
  "./api/modelDeployments": "./src/api/modelDeployments/index.ts"
  "./api/modelSources": "./src/api/modelSources/index.ts"
  "./api/aiModels": "./src/api/aiModels/index.ts"
  "./api/aiManagerNamespaces": "./src/api/aiManagerNamespaces/index.ts"
  "./api/aiManagers": "./src/api/aiManagers/index.ts"
  "./api/operations": "./src/api/operations/index.ts"
  "./models": "./src/models/index.ts"

targets:
  - name: browser
    tsconfig: "./config/tsconfig.src.browser.json"

  - name: esm
    condition: import
    tsconfig: "./config/tsconfig.src.esm.json"

  - name: commonjs
    condition: require
    tsconfig: "./config/tsconfig.src.cjs.json"
    moduleType: commonjs
