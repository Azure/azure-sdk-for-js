# warp.config.yml — build configuration

exports:
  "./package.json": "./package.json"
  ".": "./src/index.ts"
  "./api": "./src/api/index.ts"
  "./api/capabilities": "./src/api/capabilities/index.ts"
  "./api/runtimeLinks": "./src/api/runtimeLinks/index.ts"
  "./api/runtimeBindings": "./src/api/runtimeBindings/index.ts"
  "./api/workloadSpaces": "./src/api/workloadSpaces/index.ts"
  "./models": "./src/models/index.ts"

targets:
  - name: browser
    tsconfig: "./config/tsconfig.src.browser.json"

  - name: esm
    condition: import
    tsconfig: "./config/tsconfig.src.esm.json"

  - name: commonjs
    condition: require
    tsconfig: "./config/tsconfig.src.cjs.json"
    moduleType: commonjs
