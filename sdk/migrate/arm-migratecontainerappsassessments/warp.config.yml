# warp.config.yml — build configuration

exports:
  "./package.json": "./package.json"
  ".": "./src/index.ts"
  "./api": "./src/api/index.ts"
  "./api/containerAppsCostDetailOperations": "./src/api/containerAppsCostDetailOperations/index.ts"
  "./api/containerAppsManagedEnvironmentOperations": "./src/api/containerAppsManagedEnvironmentOperations/index.ts"
  "./api/containerAppsSummaryOperations": "./src/api/containerAppsSummaryOperations/index.ts"
  "./api/containerAppsOptionsOperations": "./src/api/containerAppsOptionsOperations/index.ts"
  "./api/assessedWebApplicationOperations": "./src/api/assessedWebApplicationOperations/index.ts"
  "./api/containerAppsAssessmentOperations": "./src/api/containerAppsAssessmentOperations/index.ts"
  "./models": "./src/models/index.ts"

targets:
  - name: browser
    tsconfig: "./config/tsconfig.src.browser.json"

  - name: esm
    condition: import
    tsconfig: "./config/tsconfig.src.esm.json"

  - name: commonjs
    condition: require
    tsconfig: "./config/tsconfig.src.cjs.json"
    moduleType: commonjs
