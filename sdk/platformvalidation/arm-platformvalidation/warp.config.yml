# warp.config.yml — build configuration

exports:
  "./package.json": "./package.json"
  ".": "./src/index.ts"
  "./api": "./src/api/index.ts"
  "./api/validationTestCategories": "./src/api/validationTestCategories/index.ts"
  "./api/validationTestVersions": "./src/api/validationTestVersions/index.ts"
  "./api/validationTests": "./src/api/validationTests/index.ts"
  "./api/validationTestRuns": "./src/api/validationTestRuns/index.ts"
  "./api/executionPlanRuns": "./src/api/executionPlanRuns/index.ts"
  "./api/validationExecutionPlans": "./src/api/validationExecutionPlans/index.ts"
  "./api/cloudValidations": "./src/api/cloudValidations/index.ts"
  "./api/operations": "./src/api/operations/index.ts"
  "./api/operationStatus": "./src/api/operationStatus/index.ts"
  "./models": "./src/models/index.ts"

targets:
  - name: browser
    tsconfig: "./config/tsconfig.src.browser.json"

  - name: esm
    condition: import
    tsconfig: "./config/tsconfig.src.esm.json"

  - name: commonjs
    condition: require
    tsconfig: "./config/tsconfig.src.cjs.json"
    moduleType: commonjs
