# warp.config.yml — build configuration

exports:
  "./package.json": "./package.json"
  ".": "./src/index.ts"
  "./api": "./src/api/index.ts"
  "./api/azureDataTransfer": "./src/api/azureDataTransfer/index.ts"
  "./api/flows": "./src/api/flows/index.ts"
  "./api/connections": "./src/api/connections/index.ts"
  "./api/pipelines": "./src/api/pipelines/index.ts"
  "./api/flowProfiles": "./src/api/flowProfiles/index.ts"
  "./api/operations": "./src/api/operations/index.ts"
  "./models": "./src/models/index.ts"

targets:
  - name: browser
    tsconfig: "./config/tsconfig.src.browser.json"

  - name: esm
    condition: import
    tsconfig: "./config/tsconfig.src.esm.json"

  - name: commonjs
    condition: require
    tsconfig: "./config/tsconfig.src.cjs.json"
    moduleType: commonjs
