# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - release/*
      - hotfix/*
  paths:
    include:
      - sdk/contosowidgetopenprverification/contoso-widget-openprverification
      - sdk/contosowidgetopenprverification/ci.yml
pr:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - sdk/contosowidgetopenprverification/contoso-widget-openprverification
      - sdk/contosowidgetopenprverification/ci.yml
extends:
  template: ../../eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: contosowidgetopenprverification
    Artifacts:
      - name: azure-contoso-widget-openprverification
        safeName: azurecontosowidgetopenprverification
