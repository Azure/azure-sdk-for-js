# warp.config.yml — build configuration

exports:
  "./package.json": "./package.json"
  ".": "./src/index.ts"
  "./api": "./src/api/index.ts"
  "./api/topologyMaps": "./src/api/topologyMaps/index.ts"
  "./api/sites": "./src/api/sites/index.ts"
  "./api/profileProbingGateways": "./src/api/profileProbingGateways/index.ts"
  "./api/profiles": "./src/api/profiles/index.ts"
  "./api/healthPolicies": "./src/api/healthPolicies/index.ts"
  "./api/endpoints": "./src/api/endpoints/index.ts"
  "./api/operations": "./src/api/operations/index.ts"
  "./models": "./src/models/index.ts"

targets:
  - name: browser
    tsconfig: "./config/tsconfig.src.browser.json"

  - name: esm
    condition: import
    tsconfig: "./config/tsconfig.src.esm.json"

  - name: commonjs
    condition: require
    tsconfig: "./config/tsconfig.src.cjs.json"
    moduleType: commonjs
