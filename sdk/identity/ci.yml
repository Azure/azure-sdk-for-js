# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - release/*
      - hotfix/*
  paths:
    include:
      - sdk/identity/

pr:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - sdk/identity/

extends:
  template: ../../eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: identity
    Artifacts:
      - name: azure-identity
        safeName: azureidentity
        triggeringPaths:
        - /sdk/test-utils/
        - /.config/
        - /.devcontainer/
        - /.github/
        - /.scripts/
        - /common/
        - /eng/
      - name: azure-identity-cache-persistence
        safeName: azureidentitycachepersistence
        triggeringPaths:
        - /sdk/identity/
      - name: azure-identity-broker
        safeName: azureidentitybroker
        # identity-broker is the only package in the repo with native
        # dependencies, so engineering-system changes (Node version handling,
        # pnpm config, pipeline templates) need to exercise it.
        triggeringPaths:
        - /eng/
        - /sdk/identity/
      - name: azure-identity-vscode
        safeName: azureidentityvscode
        skipPublishDocMs: true
        triggeringPaths:
        - /sdk/identity/
