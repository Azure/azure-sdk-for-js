# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
    exclude:
      - feature/v4
  paths:
    include:
      - sdk/deviceregistry/arm-deviceregistry
      - sdk/deviceregistry/ci.mgmt.yml
      - sdk/deviceregistry/arm-deviceregistrysoftwareupdate
pr:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
    exclude:
      - feature/v4
  paths:
    include:
      - sdk/deviceregistry/arm-deviceregistry
      - sdk/deviceregistry/ci.mgmt.yml
      - sdk/deviceregistry/arm-deviceregistrysoftwareupdate
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: deviceregistry
    Artifacts:
      - name: azure-arm-deviceregistry
        safeName: azurearmdeviceregistry
      - name: azure-arm-deviceregistrysoftwareupdate
        safeName: azurearmdeviceregistrysoftwareupdate
