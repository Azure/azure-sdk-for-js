# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - release/*
      - hotfix/*
  paths:
    include:
      - sdk/deviceregistry/iot-device-registry-software-update
      - sdk/deviceregistry/ci.yml
    exclude:
      - sdk/deviceregistry/arm-deviceregistry
      - sdk/deviceregistry/ci.mgmt.yml
pr:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
  paths:
    include:
      - sdk/deviceregistry/iot-device-registry-software-update
      - sdk/deviceregistry/ci.yml
    exclude:
      - sdk/deviceregistry/arm-deviceregistry
      - sdk/deviceregistry/ci.mgmt.yml
extends:
  template: ../../eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: deviceregistry
    Artifacts:
      - name: azure-iot-device-registry-software-update
        safeName: azureiotdeviceregistrysoftwareupdate
