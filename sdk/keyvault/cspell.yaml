# cspell configuration for this service. Words are case-insensitive and
# kept sorted alphabetically. The import of the central config is required.
import:
  - ../../.vscode/cspell.json
words:
  - BYOK
  - deletesas
  - Dversion
  - ECHSM
  - ekus
  - getsas
  - kvpublictest
  - listsas
  - mhsm
  - mhsmip
  - OKPHSM
  - RSAHSM
  - RSNULL
  - SECG
  - SECP
  - setsas
  - subid
  - upns
  - vitestconfigs
  - Vnet
