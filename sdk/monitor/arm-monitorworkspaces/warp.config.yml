# warp.config.yml — build configuration

exports:
  "./package.json": "./package.json"
  ".": "./src/index.ts"
  "./api": "./src/api/index.ts"
  "./api/traceAssociations": "./src/api/traceAssociations/index.ts"
  "./api/traceAssociationsAtSubscription": "./src/api/traceAssociationsAtSubscription/index.ts"
  "./api/traceAssociationsAtResourceGroup": "./src/api/traceAssociationsAtResourceGroup/index.ts"
  "./api/traceContainers": "./src/api/traceContainers/index.ts"
  "./api/metricConfigurations": "./src/api/metricConfigurations/index.ts"
  "./api/metricNamespaces": "./src/api/metricNamespaces/index.ts"
  "./api/metricsContainers": "./src/api/metricsContainers/index.ts"
  "./api/issue": "./src/api/issue/index.ts"
  "./api/azureMonitorWorkspaces": "./src/api/azureMonitorWorkspaces/index.ts"
  "./api/operations": "./src/api/operations/index.ts"
  "./models": "./src/models/index.ts"

targets:
  - name: browser
    tsconfig: "./config/tsconfig.src.browser.json"

  - name: esm
    condition: import
    tsconfig: "./config/tsconfig.src.esm.json"

  - name: commonjs
    condition: require
    tsconfig: "./config/tsconfig.src.cjs.json"
    moduleType: commonjs
