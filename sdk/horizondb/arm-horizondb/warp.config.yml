# warp.config.yml — build configuration

exports:
  "./package.json": "./package.json"
  ".": "./src/index.ts"
  "./api": "./src/api/index.ts"
  "./api/logFiles": "./src/api/logFiles/index.ts"
  "./api/logCaptureConfigurations": "./src/api/logCaptureConfigurations/index.ts"
  "./api/nodes": "./src/api/nodes/index.ts"
  "./api/maintenanceEvents": "./src/api/maintenanceEvents/index.ts"
  "./api/endpoints": "./src/api/endpoints/index.ts"
  "./api/changeDataCaptureConfigurations": "./src/api/changeDataCaptureConfigurations/index.ts"
  "./api/identityAssignments": "./src/api/identityAssignments/index.ts"
  "./api/changeDataCaptureDestinations": "./src/api/changeDataCaptureDestinations/index.ts"
  "./api/changeDataCaptureCapabilities": "./src/api/changeDataCaptureCapabilities/index.ts"
  "./api/microsoftEntraAuthentications": "./src/api/microsoftEntraAuthentications/index.ts"
  "./api/passwordAuthentications": "./src/api/passwordAuthentications/index.ts"
  "./api/authentications": "./src/api/authentications/index.ts"
  "./api/microsoftEntraAdministrators": "./src/api/microsoftEntraAdministrators/index.ts"
  "./api/defaultParameterGroups": "./src/api/defaultParameterGroups/index.ts"
  "./api/parameterGroups": "./src/api/parameterGroups/index.ts"
  "./api/privateLinkResources": "./src/api/privateLinkResources/index.ts"
  "./api/privateEndpointConnections": "./src/api/privateEndpointConnections/index.ts"
  "./api/firewallRules": "./src/api/firewallRules/index.ts"
  "./api/pools": "./src/api/pools/index.ts"
  "./api/clusters": "./src/api/clusters/index.ts"
  "./api/capabilities": "./src/api/capabilities/index.ts"
  "./api/operations": "./src/api/operations/index.ts"
  "./models": "./src/models/index.ts"

targets:
  - name: browser
    tsconfig: "./config/tsconfig.src.browser.json"

  - name: esm
    condition: import
    tsconfig: "./config/tsconfig.src.esm.json"

  - name: commonjs
    condition: require
    tsconfig: "./config/tsconfig.src.cjs.json"
    moduleType: commonjs
