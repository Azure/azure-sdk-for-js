# warp.config.yml — build configuration

exports:
  "./package.json": "./package.json"
  ".": "./src/index.ts"
  "./api": "./src/generated/api/index.ts"
  "./api/voiceAgents": "./src/generated/api/voiceAgents/index.ts"
  "./api/agentEndpointConversations": "./src/generated/api/agentEndpointConversations/index.ts"
  "./api/voiceAgentWebSocket": "./src/generated/api/voiceAgentWebSocket/index.ts"
  "./models": "./src/generated/models/index.ts"

targets:
  - name: browser
    tsconfig: "./config/tsconfig.src.browser.json"

  - name: esm
    condition: import
    tsconfig: "./config/tsconfig.src.esm.json"

  - name: commonjs
    condition: require
    tsconfig: "./config/tsconfig.src.cjs.json"
    moduleType: commonjs
