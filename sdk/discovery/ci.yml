# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
    exclude:
      - feature/v4
  paths:
    include:
      - sdk/discovery/
    exclude:
      - sdk/discovery/ci.mgmt.yml
      - sdk/discovery/arm-discovery
pr:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
    exclude:
      - feature/v4
  paths:
    include:
      - sdk/discovery/
    exclude:
      - sdk/discovery/ci.mgmt.yml
      - sdk/discovery/arm-discovery
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: discovery
    Artifacts:
      - name: azure-ai-discovery
        safeName: azureaidiscovery
