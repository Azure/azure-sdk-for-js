[package]
name = "cosmos_js_rust_prototype"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[features]
allocator-mimalloc = ["dep:mimalloc"]

[dependencies]
azure_data_cosmos_driver = { git = "https://github.com/Azure/azure-sdk-for-rust", rev = "5ba864be8f128a6faf3f736ae0043f60d5911235" }
mimalloc = { version = "=0.1.52", optional = true, default-features = false }
napi = { version = "3.14.2", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "3.6.12"
url = "2.5"

[build-dependencies]
napi-build = "2.6.0"
