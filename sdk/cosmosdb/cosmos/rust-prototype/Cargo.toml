[package]
name = "cosmos_js_rust_prototype"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
azure_data_cosmos_driver = { git = "https://github.com/Azure/azure-sdk-for-rust", rev = "84e2bb66c9911fa730dc9756c8fc3f9612456344" }
napi = { version = "3.14.2", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "3.6.12"
url = "2.5"

[build-dependencies]
napi-build = "2.6.0"
