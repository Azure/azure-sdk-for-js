# warp.config.yml — build configuration

exports:
  "./package.json": "./package.json"
  ".": "./src/index.ts"
  "./api": "./src/api/index.ts"
  "./api/aiGatewayWorkspaceModelOperations": "./src/api/aiGatewayWorkspaceModelOperations/index.ts"
  "./api/aiGatewayApiKeyResources": "./src/api/aiGatewayApiKeyResources/index.ts"
  "./api/aiGatewayToolServerResources": "./src/api/aiGatewayToolServerResources/index.ts"
  "./api/aiGatewayModelResources": "./src/api/aiGatewayModelResources/index.ts"
  "./api/aiGatewayModelProviderResources": "./src/api/aiGatewayModelProviderResources/index.ts"
  "./api/aiGatewayWorkspaceResources": "./src/api/aiGatewayWorkspaceResources/index.ts"
  "./api/aiGatewayPrivateLinkResources": "./src/api/aiGatewayPrivateLinkResources/index.ts"
  "./api/aiGatewayPrivateEndpointConnections": "./src/api/aiGatewayPrivateEndpointConnections/index.ts"
  "./api/aiGatewayResources": "./src/api/aiGatewayResources/index.ts"
  "./api/aiGatewayAliasResources": "./src/api/aiGatewayAliasResources/index.ts"
  "./api/aiGatewayTelemetryExporterResources": "./src/api/aiGatewayTelemetryExporterResources/index.ts"
  "./api/aiGatewayNameAvailabilityOperations": "./src/api/aiGatewayNameAvailabilityOperations/index.ts"
  "./api/operations": "./src/api/operations/index.ts"
  "./models": "./src/models/index.ts"

targets:
  - name: browser
    tsconfig: "./config/tsconfig.src.browser.json"

  - name: esm
    condition: import
    tsconfig: "./config/tsconfig.src.esm.json"

  - name: commonjs
    condition: require
    tsconfig: "./config/tsconfig.src.cjs.json"
    moduleType: commonjs
