# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - release/*
      - hotfix/*
    exclude:
      - feature/v4
  paths:
    include:
      - sdk/apimanagement/ci.mgmt.yml
      - sdk/apimanagement/arm-apimanagement
      - sdk/apimanagement/arm-aigateway
pr:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
    exclude:
      - feature/v4
  paths:
    include:
      - sdk/apimanagement/ci.mgmt.yml
      - sdk/apimanagement/arm-apimanagement
      - sdk/apimanagement/arm-aigateway
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: apimanagement
    Artifacts:
      - name: azure-arm-apimanagement
        safeName: azurearmapimanagement
      - name: azure-arm-aigateway
        safeName: azurearmaigateway
