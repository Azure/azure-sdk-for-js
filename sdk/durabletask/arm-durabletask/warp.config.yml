# warp.config.yml — build configuration

exports:
  "./package.json": "./package.json"
  ".": "./src/index.ts"
  "./api": "./src/api/index.ts"
  "./api/failoverInstances": "./src/api/failoverInstances/index.ts"
  "./api/transparentDataEncryptions": "./src/api/transparentDataEncryptions/index.ts"
  "./api/retentionPolicies": "./src/api/retentionPolicies/index.ts"
  "./api/taskQueues": "./src/api/taskQueues/index.ts"
  "./api/taskHubs": "./src/api/taskHubs/index.ts"
  "./api/schedulers": "./src/api/schedulers/index.ts"
  "./api/detectors": "./src/api/detectors/index.ts"
  "./api/operations": "./src/api/operations/index.ts"
  "./models": "./src/models/index.ts"
  "./models/typeSpec": "./src/models/typeSpec/index.ts"

targets:
  - name: browser
    tsconfig: "./config/tsconfig.src.browser.json"

  - name: esm
    condition: import
    tsconfig: "./config/tsconfig.src.esm.json"

  - name: commonjs
    condition: require
    tsconfig: "./config/tsconfig.src.cjs.json"
    moduleType: commonjs
