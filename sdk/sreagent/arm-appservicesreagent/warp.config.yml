# warp.config.yml — build configuration

exports:
  "./package.json": "./package.json"
  ".": "./src/index.ts"
  "./api": "./src/api/index.ts"
  "./api/supportedAgentModels": "./src/api/supportedAgentModels/index.ts"
  "./api/agentSpacesConnectors": "./src/api/agentSpacesConnectors/index.ts"
  "./api/agentSpaces": "./src/api/agentSpaces/index.ts"
  "./api/agentsConnectors": "./src/api/agentsConnectors/index.ts"
  "./api/agents": "./src/api/agents/index.ts"
  "./models": "./src/models/index.ts"

targets:
  - name: browser
    tsconfig: "./config/tsconfig.src.browser.json"

  - name: esm
    condition: import
    tsconfig: "./config/tsconfig.src.esm.json"

  - name: commonjs
    condition: require
    tsconfig: "./config/tsconfig.src.cjs.json"
    moduleType: commonjs
