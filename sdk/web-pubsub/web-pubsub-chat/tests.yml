trigger: none

extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-tests.yml
  parameters:
    PackageName: "@azure/web-pubsub-chat"
    ServiceDirectory: web-pubsub
    TestResourceDirectories:
      - web-pubsub/web-pubsub-chat
    MatrixFilters:
      - DependencyVersion=^$
      # Disables live sample execution: running samples needs substantial pre-existing data setup,
      # which would complicate focused examples. Regular tests stay enabled.
      - TestType=^(?!sample).*
