# Known positional-parameter rename pairs that the customization layer applies
# to operation signatures but does NOT propagate into function bodies or helper
# invocations. PostEmitter.ps1 reads this table and updates code tokens in a
# function body only after confirming that its signature already uses `new`.
#
# Add a new entry whenever a regen surfaces a deterministic TS2304 `Cannot find
# name '<old>'` mismatch in one of the files below (or in a new file), and add a
# fixture to scripts/test-post-emitter.ps1. Unknown or ambiguous shapes must
# continue to fail closed.
#
# Schema:
#   - file: workspace-relative path under sdk/ai/ai-projects/
#     old:  identifier as it appears in the emitted (spec) signature
#     new:  identifier as the customization layer renames it
#     note: optional free-form context

renames:
  - file: src/api/beta/agents/operations.ts
    old: agentSessionId
    new: sessionId
  - file: src/api/beta/toolboxes/operations.ts
    old: name
    new: toolboxName
  - file: src/classic/beta/toolboxes/index.ts
    old: name
    new: toolboxName
