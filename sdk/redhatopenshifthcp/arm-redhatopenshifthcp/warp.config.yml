# warp.config.yml — build configuration

exports:
  "./package.json": "./package.json"
  ".": "./src/index.ts"
  "./api": "./src/api/index.ts"
  "./api/hcpOperatorIdentityRoleSets": "./src/api/hcpOperatorIdentityRoleSets/index.ts"
  "./api/hcpOpenShiftVersions": "./src/api/hcpOpenShiftVersions/index.ts"
  "./api/externalAuths": "./src/api/externalAuths/index.ts"
  "./api/nodePools": "./src/api/nodePools/index.ts"
  "./api/hcpOpenShiftClusters": "./src/api/hcpOpenShiftClusters/index.ts"
  "./api/operations": "./src/api/operations/index.ts"
  "./models": "./src/models/index.ts"

targets:
  - name: browser
    tsconfig: "./config/tsconfig.src.browser.json"

  - name: esm
    condition: import
    tsconfig: "./config/tsconfig.src.esm.json"

  - name: commonjs
    condition: require
    tsconfig: "./config/tsconfig.src.cjs.json"
    moduleType: commonjs
