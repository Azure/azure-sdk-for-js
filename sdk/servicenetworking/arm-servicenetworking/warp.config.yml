# warp.config.yml — build configuration

exports:
  "./package.json": "./package.json"
  ".": "./src/index.ts"
  "./api": "./src/api/index.ts"
  "./api/operations": "./src/api/operations/index.ts"
  "./api/privateLinkResourcesInterface": "./src/api/privateLinkResourcesInterface/index.ts"
  "./api/privateEndpointConnectionsInterface": "./src/api/privateEndpointConnectionsInterface/index.ts"
  "./api/trafficControllerInterface": "./src/api/trafficControllerInterface/index.ts"
  "./api/securityPoliciesInterface": "./src/api/securityPoliciesInterface/index.ts"
  "./api/frontendsInterface": "./src/api/frontendsInterface/index.ts"
  "./api/associationsInterface": "./src/api/associationsInterface/index.ts"
  "./models": "./src/models/index.ts"

targets:
  - name: browser
    tsconfig: "./config/tsconfig.src.browser.json"

  - name: esm
    condition: import
    tsconfig: "./config/tsconfig.src.esm.json"

  - name: commonjs
    condition: require
    tsconfig: "./config/tsconfig.src.cjs.json"
    moduleType: commonjs
