# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
    exclude:
      - feature/v4
  paths:
    include:
      - sdk/cost-management/arm-costmanagement
      - sdk/cost-management/ci.mgmt.yml
      - sdk/cost-management/arm-costmanagementpriceestimation
pr:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
    exclude:
      - feature/v4
  paths:
    include:
      - sdk/cost-management/arm-costmanagement
      - sdk/cost-management/ci.mgmt.yml
      - sdk/cost-management/arm-costmanagementpriceestimation
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: cost-management
    Artifacts:
      - name: azure-arm-costmanagement
        safeName: azurearmcostmanagement
      - name: azure-arm-costmanagementpriceestimation
        safeName: azurearmcostmanagementpriceestimation
