# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

trigger:
  branches:
    include:
      - main
      - release/*
      - hotfix/*
    exclude:
      - feature/v4
  paths:
    include:
      - sdk/applicationinsights/ci.mgmt.yml
      - sdk/applicationinsights/arm-appinsights
      - sdk/applicationinsights/provisioning-appinsights
pr:
  branches:
    include:
      - main
      - feature/*
      - release/*
      - hotfix/*
    exclude:
      - feature/v4
  paths:
    include:
      - sdk/applicationinsights/ci.mgmt.yml
      - sdk/applicationinsights/arm-appinsights
      - sdk/applicationinsights/provisioning-appinsights
extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: applicationinsights
    Artifacts:
      - name: azure-arm-appinsights
        safeName: azurearmappinsights
      - name: azure-provisioning-appinsights
        safeName: azureprovisioningappinsights
