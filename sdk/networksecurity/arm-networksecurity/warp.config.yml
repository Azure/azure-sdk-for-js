# warp.config.yml — build configuration

exports:
  "./package.json": "./package.json"
  ".": "./src/index.ts"
  "./api": "./src/api/index.ts"
  "./api/neuroShieldMitigations": "./src/api/neuroShieldMitigations/index.ts"
  "./api/neuroShieldFindings": "./src/api/neuroShieldFindings/index.ts"
  "./api/neuroShieldProtectedResources": "./src/api/neuroShieldProtectedResources/index.ts"
  "./api/neuroShieldSummaries": "./src/api/neuroShieldSummaries/index.ts"
  "./api/neuroShields": "./src/api/neuroShields/index.ts"
  "./api/neuroShieldOperationStatuses": "./src/api/neuroShieldOperationStatuses/index.ts"
  "./api/operations": "./src/api/operations/index.ts"
  "./models": "./src/models/index.ts"

targets:
  - name: browser
    tsconfig: "./config/tsconfig.src.browser.json"

  - name: esm
    condition: import
    tsconfig: "./config/tsconfig.src.esm.json"

  - name: commonjs
    condition: require
    tsconfig: "./config/tsconfig.src.cjs.json"
    moduleType: commonjs
