# warp.config.yml — build configuration

exports:
  "./package.json": "./package.json"
  ".": "./src/index.ts"
  "./api": "./src/api/index.ts"
  "./api/workspaces": "./src/api/workspaces/index.ts"
  "./api/services": "./src/api/services/index.ts"
  "./api/projects": "./src/api/projects/index.ts"
  "./api/jobs": "./src/api/jobs/index.ts"
  "./api/containerImages": "./src/api/containerImages/index.ts"
  "./api/computeConfigs": "./src/api/computeConfigs/index.ts"
  "./api/cloudResources": "./src/api/cloudResources/index.ts"
  "./api/clouds": "./src/api/clouds/index.ts"
  "./api/agreements": "./src/api/agreements/index.ts"
  "./api/operationStatuses": "./src/api/operationStatuses/index.ts"
  "./api/operations": "./src/api/operations/index.ts"
  "./models": "./src/models/index.ts"

targets:
  - name: browser
    tsconfig: "./config/tsconfig.src.browser.json"

  - name: esm
    condition: import
    tsconfig: "./config/tsconfig.src.esm.json"

  - name: commonjs
    condition: require
    tsconfig: "./config/tsconfig.src.cjs.json"
    moduleType: commonjs
